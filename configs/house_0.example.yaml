experiment:
  name: "direction1-house0"
  seed: 42
  output_dir: "outputs/direction1-house0"
  overwrite: true
  modes:
    - full_tx
    - uniform
    - flat_variance
    - legacy_two_stage
    - true_hierarchical
    - true_hierarchical_cap

data:
  path: "data/synthetic_house_0.csv"
  format: "csv"
  house_id: 0
  load_property_value: 1
  timestamp_unit: "seconds"
  timezone: "UTC"
  columns:
    id: "id"
    timestamp: "timestamp"
    value: "value"
    property: "property"
    plug_id: "plug_id"
    household_id: "household_id"
    house_id: "house_id"

splits:
  warmup:
    start: "2013-09-01T00:00:00Z"
    end: "2013-09-01T05:59:59Z"
  validation:
    enabled: false
    start: null
    end: null
  evaluation:
    start: "2013-09-01T06:00:00Z"
    end: "2013-09-01T11:59:59Z"

predictor:
  type: "time_slice_median"
  slot_seconds: 300

budget:
  epsilon_ratio: 0.01

replay:
  allocation_period_seconds: 300
  active_window_seconds: 600
  float_tolerance: 1.0e-9
  top_k_outliers: 100

residual:
  estimator: "exact"
  rolling_window_size: 1000
  min_samples: 30
  sigma_floor_percentile: 5.0

true_hierarchy:
  household_fairness_alpha: 0.20
  plug_fairness_beta: 0.10
  household_score:
    lambda_mean: 0.50
    lambda_max: 0.40
    lambda_count: 0.10

cap:
  enabled: true
  quantile: 0.95
  multiplier: 1.0
  max_house_budget_fraction: 0.25
  min_samples: 30
  redistribution_tolerance: 1.0e-9
  max_iterations_extra: 10

artifacts:
  write_threshold_trace: true
  write_plug_metrics: true
  write_household_metrics: true
  write_plots: true
