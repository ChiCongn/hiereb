# docker-compose.override.yml
#
# Development overrides. Activated automatically when you run:
#   docker compose up
#
# Or explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# Changes vs production:
#   - All Python services use Dockerfile.dev
#   - Source code mounted as volume → edit on host, no rebuild needed
#   - LOG_LEVEL=DEBUG
#   - No memory limits (easier debugging)

services:

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /hiereb/data:/data:ro
      - ./src:/app/src          # hot-reload: changes visible without rebuild
      - ./config:/app/config
    environment:
      LOG_LEVEL: DEBUG
    deploy:
      resources: {}             # remove memory limit for dev

  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    environment:
      LOG_LEVEL: DEBUG
    deploy:
      resources: {}

  ml-hiereb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - /hiereb/data:/data:ro
      - ./src:/app/src
      - ./config:/app/config
    environment:
      LOG_LEVEL: DEBUG
    deploy:
      resources: {}