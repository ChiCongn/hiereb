networks:
  hiereb_net:
    driver: bridge

volumes:
  kafka_data:
  timescale_data:
  grafana_data:

services:
  # ── Kafka (KRaft mode) ──────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    networks:
      - hiereb_net
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── TimescaleDB ────────────────────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: timescaledb
    hostname: timescaledb
    networks:
      - hiereb_net
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hiereb
      POSTGRES_PASSWORD: hiereb_pass
      POSTGRES_DB: hiereb_db
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiereb -d hiereb_db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    hostname: grafana
    networks:
      - hiereb_net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: hiereb_pass
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── IoT Simulator ──────────────────────────────────────────────────────────
  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiereb-simulator
    networks:
      - hiereb_net
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_PATH: /data
    volumes:
      - /hiereb/data:/data:ro # DEBS CSV mounted read-only
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: ["python", "-m", "src.simulator.main"]
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Aggregator ────────────────────────────────────────────
  aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiereb-aggregator
    networks:
      - hiereb_net
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: timescaledb
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["python", "-m", "src.aggregator.main"]
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M

  # ── ML + HierEB Allocator ───────────────────────────────────────
  ml-hiereb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiereb-ml
    networks:
      - hiereb_net
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_PATH: /data
    volumes:
      - /hiereb/data:/data:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["python", "-m", "src.ml_hiereb.main"]
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 1G
