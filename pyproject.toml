[project]
name = "hiereb"
version = "0.1.0"
description = "Deterministic offline HierEB Direction 1 research simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "polars>=1.30",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "scipy>=1.15",
    "typer>=0.16",
]

[project.scripts]
hiereb = "hiereb.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.130",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiereb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hiereb"]

[[tool.mypy.overrides]]
module = ["yaml", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

